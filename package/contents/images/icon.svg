<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
    <title id="title">Switcher</title>
    <desc id="desc">A rocker switch in a window on a blue circular background.</desc>

    <defs>
        <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
            <stop offset="0" stop-color="#18A0F0"/>
            <stop offset="1" stop-color="#5C55F8"/>
        </linearGradient>
        <linearGradient id="rocker" x2="0" y2="1">
            <stop stop-color="#586e83"/>
            <stop offset="0.55" stop-color="#42586b"/>
            <stop offset="1" stop-color="#344859"/>
        </linearGradient>
    </defs>

    <!-- Soft circular backdrop -->
    <circle cx="256" cy="256" r="232" fill="url(#g)"/>

    <!-- Terminal window (centered) -->
    <g transform="translate(96,136)">
        <rect x="0" y="0" width="320" height="240" rx="12" fill="#071025" stroke="#0f1724" stroke-width="3"/>
        <!-- Top accent bar -->
        <rect x="0" y="0" width="320" height="36" rx="12" fill="#0b1a2a"/>
        <!-- control dots (subtle) -->
        <circle cx="22" cy="18" r="5" fill="#FF5C56"/>
        <circle cx="44" cy="18" r="5" fill="#FFBD2E"/>
        <circle cx="66" cy="18" r="5" fill="#27C93F"/>

        <g transform="translate(160,138) scale(0.8) translate(-256,-273)">
            <rect x="191" y="181" width="130" height="184" rx="18" fill="#253547" stroke="#405369" stroke-width="3"/>
            <g fill="#55697b">
                <circle cx="256" cy="197" r="3.5"/>
                <circle cx="256" cy="350" r="3.5"/>
            </g>
            <rect x="213" y="209" width="86" height="129" rx="11" fill="#101b29"/>
            <path d="M220 221q0-6 6-6h60q6 0 6 6v55l-5 48q-1 7-8 7h-46q-7 0-8-7l-5-48z" fill="#1e2d3b"/>
            <path d="M220 221q0-6 6-6h60q6 0 6 6v55l-5 40q-1 6-8 6h-46q-7 0-8-6l-5-40z" fill="url(#rocker)"/>
            <rect x="244" y="229" width="24" height="5" rx="2.5" fill="#6cb6b6"/>
        </g>
    </g>

    <!-- Small sparkle to hint "UI" rendering (clean, single shape) -->
    <g transform="translate(378,82)" fill="#FFFFFF" opacity="0.92">
        <path d="M8 0l2.5 6.5L17 8l-6.5 1.5L8 17 6.5 9.5 0 8l6.5-1.5z"/>
    </g>
</svg>
